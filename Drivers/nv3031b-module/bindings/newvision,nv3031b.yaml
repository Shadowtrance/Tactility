description: NewVision NV3031B display panel over QSPI

bus: spi

compatible: "newvision,nv3031b"

properties:
  horizontal-resolution:
    type: int
    required: true
    description: Horizontal resolution in pixels
  vertical-resolution:
    type: int
    required: true
    description: Vertical resolution in pixels
  gap-x:
    type: int
    default: 0
    description: X offset applied to all draw operations
  gap-y:
    type: int
    default: 0
    description: Y offset applied to all draw operations
  swap-xy:
    type: boolean
    default: false
    description: Swap the X and Y axes
  mirror-x:
    type: boolean
    default: false
    description: Mirror the X axis
  mirror-y:
    type: boolean
    default: false
    description: Mirror the Y axis
  invert-color:
    type: boolean
    default: false
    description: Invert the panel's color output
  bgr-order:
    type: boolean
    default: false
    description: Use BGR element order instead of RGB
  pixel-clock-hz:
    type: int
    default: 40000000
    description: SPI clock frequency in Hz
  transaction-queue-depth:
    type: int
    default: 10
    description: Size of the internal SPI transaction queue
  pin-reset:
    type: phandles
    default: GPIO_PIN_SPEC_NONE
    description: Reset pin, driven active-low by the driver. Pins on an IO expander are supported.
  backlight:
    type: phandle
    default: "NULL"
    description: Optional reference to this display's backlight device
